# CI for the autofit engine (run-brief item: gates cannot silently skip).
#
# Two jobs:
# - fast-suite: the full always-on pytest suite. The junit guard fails the
#   job if fewer than the floor of tests actually RAN or if any skipped
#   case is absent from the exact allowlist: three required slow modules
#   plus four candidate-pool cases gated by unavailable data/long budgets.
# - required-gates: the three RUN_AUTOFIT_GATE=1 gates with a ZERO-skip
#   guard — the gate job can never green while the gates skip.
#
# NOTE: numeric pins were calibrated on macOS/arm64; linux runners use a
# different BLAS. Fixture tolerances carry documented FP-wobble margins
# (rtol 1e-3 vs measured 1e-4) — a linux-only failure here is signal about
# platform sensitivity, not noise to be silenced.

name: autofit-tests-and-gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest playwright
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript behavior and independent scientific audit checks
        env:
          XPS_PYTHON: python
        run: |
          node --test tests/js/*.test.js
          node scripts/audit_application_repro.js
          python scripts/audit_science_benchmark.py --output science-validation.json
          python scripts/audit_statistics_repro.py
      # the browser tests importorskip playwright — installing it (plus a
      # chromium build) keeps them RUNNING in CI instead of silently
      # skipping (the guard's explicit allowlist never permits browser skips)
      - run: playwright install --with-deps chromium
      - name: pytest (full fast suite)
        run: |
          set -o pipefail
          pytest tests/ -q --junitxml=fast-suite.xml 2>&1 | tee pytest.log
      - name: no-silent-skip guard (explicit slow and unavailable-data cases only)
        if: always()
        run: python scripts/ci_check_junit.py fast-suite.xml --min-tests 350 --max-skipped 7 --allowed-skips scripts/ci_known_fast_skips.json --tail pytest.log

  required-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: run the REQUIRED slow gates
        env:
          RUN_AUTOFIT_GATE: "1"
        run: |
          set -o pipefail
          pytest tests/autofit/test_c1s_parity_gate.py \
            tests/autofit/test_bayesian_real_gate.py \
            tests/autofit/test_bayesian_u4f_unresolved_gate.py \
            -q --junitxml=gates.xml 2>&1 | tee gates.log
      - name: zero-skip guard — gates can never silently skip
        if: always()
        run: python scripts/ci_check_junit.py gates.xml --min-tests 5 --max-skipped 0 --tail gates.log
